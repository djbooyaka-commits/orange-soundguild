name: Build PC Remote installers

on:
  push:
    branches: [main]
    paths:
      - "public/pc-remote/**"
      - ".github/workflows/build-pc-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: OSG-PC-Remote.exe
          - os: macos-latest
            out: OSG-PC-Remote-mac
          - os: ubuntu-latest
            out: OSG-PC-Remote-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller mss pillow pyautogui requests
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev scrot
      - run: pyinstaller --onefile --name OSG-PC-Remote public/pc-remote/osg_pc_remote.py
      - name: Rename
        shell: bash
        run: |
          src=dist/OSG-PC-Remote
          if [ -f dist/OSG-PC-Remote.exe ]; then src=dist/OSG-PC-Remote.exe; fi
          dst="dist/${{ matrix.out }}"
          if [ "$src" != "$dst" ]; then mv "$src" "$dst"; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out && test -f out/OSG-PC-Remote.exe
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Version file
        run: |
          v=$(grep -m1 '^VERSION = ' src/public/pc-remote/osg_pc_remote.py | cut -d'"' -f2)
          echo "{\"version\": \"$v\"}" > out/pc-version.json
          cat out/pc-version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: osg-pc-remote-latest
          name: OSG PC Remote (latest)
          body: Download, open, type the pairing code from orangesoundguild.com/pc-remote. Starts automatically after that.
          files: out/*
          make_latest: false
