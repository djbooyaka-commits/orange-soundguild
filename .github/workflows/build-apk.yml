name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build OSG Remote APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk osg-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: osg-remote-apk
          path: android/osg-remote.apk

      # Stable download link: Releases > "OSG Remote (latest)"
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: osg-remote-latest
          name: OSG Remote (latest)
          files: android/osg-remote.apk
