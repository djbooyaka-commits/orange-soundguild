name: Build standalone Spotify Helper

on:
  push:
    branches: [main]
    paths:
      - "desktop/spotify-helper/**"
      - ".github/workflows/build-spotify-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: desktop/spotify-helper/go.sum
      - name: Build standalone executable
        shell: pwsh
        run: ./desktop/spotify-helper/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OSG-Spotify-Helper-Windows-x64
          path: public/downloads/OSG-Spotify-Helper.exe
          if-no-files-found: error